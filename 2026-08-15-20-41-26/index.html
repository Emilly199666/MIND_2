<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIND · 脑海</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- 顶部栏 -->
    <header id="topbar">
      <div class="topbar-left">
        <button id="nav-toggle" class="sb-toggle" title="收起导航栏" aria-label="收起导航栏"><span class="sb-bar"></span></button>
        <div class="brand">
          <img class="brand-logo" src="assets/logo.png" alt="MIND" />
          <span class="brand-name">MIND</span>
          <span class="brand-cn">脑海</span>
        </div>
      </div>
      <div id="topbar-profile" class="topbar-profile"></div>
    </header>

    <div id="body">
      <!-- 左侧导航 -->
      <nav id="sidebar">
        <ul id="nav-list"></ul>
      </nav>

      <!-- 主内容 -->
      <main id="app-main"></main>
    </div>
  </div>

  <!-- 通用弹窗容器 -->
  <div id="modal-root"></div>
  <!-- 轻提示 -->
  <div id="toast-root"></div>

  <!-- 云端同步（LeanCloud，仅在设置页启用同步后才会使用；加载失败不影响本地使用） -->
  <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4/dist/leancloud-storage.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/mindmap.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
